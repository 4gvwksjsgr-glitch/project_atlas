# Sandbox-only: manual authenticated invoke of billing-webhook-processor-paddle.
# Accepts legitimate HTTP 200 processor outcomes (aligned with schedule workflow):
#   disabled | empty | processed → Actions success
#   failed_finalized → controlled Actions failure (no retry)
# No schedule. No repository checkout. No elevated DB roles. Exactly one POST, zero retries.
name: Billing Webhook Processor — Sandbox Manual Dispatch

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: billing-webhook-processor-sandbox
  cancel-in-progress: false

jobs:
  invoke-sandbox-processor:
    name: Invoke sandbox processor (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PROCESSOR_URL: https://onwctqltagegupyhwglf.supabase.co/functions/v1/billing-webhook-processor-paddle
    steps:
      - name: Single authenticated POST (no retry)
        env:
          ATLAS_BILLING_PROCESSOR_INVOKE_SECRET: ${{ secrets.ATLAS_BILLING_PROCESSOR_INVOKE_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          : "${ATLAS_BILLING_PROCESSOR_INVOKE_SECRET:?missing ATLAS_BILLING_PROCESSOR_INVOKE_SECRET}"
          : "${SUPABASE_ANON_KEY:?missing SUPABASE_ANON_KEY}"
          : "${PROCESSOR_URL:?missing PROCESSOR_URL}"

          HTTP_POST_COUNT=1
          HTTP_RETRY_COUNT=0

          BODY="$(mktemp)"
          cleanup() { rm -f "$BODY"; }
          trap cleanup EXIT

          set +e
          HTTP_STATUS="$(
            curl -sS \
              -o "$BODY" \
              -w '%{http_code}' \
              --connect-timeout 10 \
              --max-time 30 \
              -X POST "$PROCESSOR_URL" \
              -H 'Content-Type: application/json' \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "x-atlas-processor-secret: ${ATLAS_BILLING_PROCESSOR_INVOKE_SECRET}" \
              --data '{}'
          )"
          CURL_EC=$?
          set -e

          if [ "$CURL_EC" -ne 0 ]; then
            echo "CURL_TRANSPORT_FAILED=${CURL_EC}"
            echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
            echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
            exit 1
          fi

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "HTTP_STATUS=${HTTP_STATUS}"
            echo "PROCESSOR_RESPONSE_VALIDATION_FAILED=1"
            echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
            echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
            exit 1
          fi

          # Base contract: object, ok=true, allowed outcome,
          # correlation_id = UUID syntax (processor uses crypto.randomUUID()).
          if ! jq -e '
            (type == "object")
            and (.ok | type == "boolean") and (.ok == true)
            and (.outcome | type == "string")
            and (.outcome == "disabled"
                 or .outcome == "empty"
                 or .outcome == "processed"
                 or .outcome == "failed_finalized")
            and (.correlation_id | type == "string")
            and (.correlation_id | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"))
          ' "$BODY" >/dev/null; then
            echo "HTTP_STATUS=200"
            echo "PROCESSOR_RESPONSE_VALIDATION_FAILED=1"
            echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
            echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
            exit 1
          fi

          OUTCOME="$(jq -r '.outcome' "$BODY")"
          CORRELATION_ID="$(jq -r '.correlation_id' "$BODY")"

          case "$OUTCOME" in
            disabled|empty)
              echo "HTTP_STATUS=200"
              echo "OUTCOME=${OUTCOME}"
              echo "CORRELATION_ID=${CORRELATION_ID}"
              echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
              echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
              exit 0
              ;;
            processed)
              if ! jq -e '
                (.inbox_event_id | type == "string")
                and (.inbox_event_id | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))
                and (.attempt_count | type == "number")
                and (.attempt_count == (.attempt_count | floor))
                and (.attempt_count >= 1)
                and (.apply_outcome | type == "string")
                and (.apply_outcome == "applied"
                     or .apply_outcome == "already_processed"
                     or .apply_outcome == "ignored"
                     or .apply_outcome == "stale")
              ' "$BODY" >/dev/null; then
                echo "HTTP_STATUS=200"
                echo "PROCESSOR_RESPONSE_VALIDATION_FAILED=1"
                echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
                echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
                exit 1
              fi
              INBOX_EVENT_ID="$(jq -r '.inbox_event_id' "$BODY")"
              ATTEMPT_COUNT="$(jq -r '.attempt_count' "$BODY")"
              APPLY_OUTCOME="$(jq -r '.apply_outcome' "$BODY")"
              echo "HTTP_STATUS=200"
              echo "OUTCOME=processed"
              echo "CORRELATION_ID=${CORRELATION_ID}"
              echo "INBOX_EVENT_ID=${INBOX_EVENT_ID}"
              echo "ATTEMPT_COUNT=${ATTEMPT_COUNT}"
              echo "APPLY_OUTCOME=${APPLY_OUTCOME}"
              echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
              echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
              exit 0
              ;;
            failed_finalized)
              if ! jq -e '
                (.inbox_event_id | type == "string")
                and (.inbox_event_id | test("^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"))
                and (.attempt_count | type == "number")
                and (.attempt_count == (.attempt_count | floor))
                and (.attempt_count >= 1)
                and (.error_code | type == "string")
                and ((.error_code | length) > 0)
                and (.error_code | test("^ATLAS_[A-Z0-9_]+$"))
              ' "$BODY" >/dev/null; then
                echo "HTTP_STATUS=200"
                echo "PROCESSOR_RESPONSE_VALIDATION_FAILED=1"
                echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
                echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
                exit 1
              fi
              INBOX_EVENT_ID="$(jq -r '.inbox_event_id' "$BODY")"
              ATTEMPT_COUNT="$(jq -r '.attempt_count' "$BODY")"
              ERROR_CODE="$(jq -r '.error_code' "$BODY")"
              echo "HTTP_STATUS=200"
              echo "OUTCOME=failed_finalized"
              echo "CORRELATION_ID=${CORRELATION_ID}"
              echo "INBOX_EVENT_ID=${INBOX_EVENT_ID}"
              echo "ATTEMPT_COUNT=${ATTEMPT_COUNT}"
              echo "ERROR_CODE=${ERROR_CODE}"
              echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
              echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
              # Controlled business fail: visible Actions FAILURE, never retry.
              exit 1
              ;;
            *)
              echo "HTTP_STATUS=200"
              echo "PROCESSOR_RESPONSE_VALIDATION_FAILED=1"
              echo "HTTP_POST_COUNT=${HTTP_POST_COUNT}"
              echo "HTTP_RETRY_COUNT=${HTTP_RETRY_COUNT}"
              exit 1
              ;;
          esac
